<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="color-scheme" content="light"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TOM Admin</title>
<style>
:root{color-scheme:light;--g:#3F5B30;--o:#FF6B00;--r:#C84B0A;--bg:#F7F3EC;--s:#fff;--t:#131A2A;--m:#6B7280;--b:#E3DCCF}

*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--t);font-size:15px}
.w{max-width:980px;margin:0 auto;padding:12px}
input,select,button{font:inherit;color:inherit;border:1px solid var(--b);border-radius:8px;padding:8px 10px;background:var(--s);min-height:40px}
button{cursor:pointer;font-weight:600}button.p{background:var(--o);border-color:var(--o);color:#fff}button.d{color:#c0392b}
:focus-visible{outline:3px solid var(--o)}
.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.tab[aria-pressed=true]{background:var(--g);color:#fff;border-color:var(--g)}
.c{background:var(--s);border:1px solid var(--b);border-radius:12px;padding:12px;margin-bottom:10px}
.k{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-bottom:10px}.k div{background:var(--s);border:1px solid var(--b);border-radius:10px;padding:8px}.k b{font-size:1.3rem;display:block}
.m{color:var(--m);font-size:.85rem}.st{display:inline-block;background:#eef3e8;color:#2e4423;border-radius:6px;padding:1px 8px;font-size:.8rem;font-weight:700}
.row{display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap}
#msg{position:sticky;top:0;z-index:5}.e{background:#fde2e0;color:#8a1c14;padding:8px 12px;border-radius:8px;margin-bottom:8px}.ok{background:#e2f3e5;color:#14532d;padding:8px 12px;border-radius:8px;margin-bottom:8px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:8px}.g2 label{display:block}.g2 input:not([type=checkbox]),.g2 select,.g2 textarea{width:100%;font:inherit;border:1px solid var(--b);border-radius:8px;padding:8px 10px;background:var(--s);color:inherit}.gh{margin:14px 0 6px;font-weight:700;color:var(--g)}</style></head><body><div class="w">
